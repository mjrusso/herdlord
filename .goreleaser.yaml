version: 2
project_name: herdlord
before:
  hooks:
    - go mod tidy
builds:
  - main: ./cmd/herdlord
    binary: herdlord
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/mjrusso/herdlord/internal/buildinfo.Version={{.Version}} -X github.com/mjrusso/herdlord/internal/buildinfo.Commit={{.Commit}} -X github.com/mjrusso/herdlord/internal/buildinfo.Date={{.Date}}
archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ if eq .Arch "amd64" }}x64{{ else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
checksum:
  name_template: checksums.txt
snapshot:
  version_template: "{{ incpatch .Version }}-next"
release:
  github:
    owner: mjrusso
    name: herdlord
