version: "2"

linters:
  default: standard
  # `standard` enables: errcheck, govet, ineffassign, staticcheck, unused.
  enable:
    - revive
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mjrusso/herdlord
